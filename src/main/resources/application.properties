spring.application.name=gestionAcademica

# Credenciales y secretos locales (no se suben a git): copia application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_academico?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# La BD ya existe (ver db/schema.sql): no dejar que Hibernate genere/altere el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Los mappers DTO leen relaciones LAZY después de salir del servicio
spring.jpa.open-in-view=true

# JWT: el secreto debe tener al menos 32 caracteres
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}

# Usuario administrativo que se crea al arrancar si la tabla usuarios está vacía
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

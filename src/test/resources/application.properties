# Configuración de pruebas: H2 en memoria con el esquema generado desde las entidades (no toca MySQL)
# Cada contexto de prueba usa su propia BD H2 en memoria
spring.datasource.generate-unique-name=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true

